<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小國語打字比賽系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bpmf+Gen+Sen+Rounded&display=swap'); /* 嘗試引入注音字型，若無則用系統字 */
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }

        .typing-font {
            font-family: 'Noto Sans TC', monospace;
            letter-spacing: 0.1em;
        }

        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 5px;
            border: 2px solid #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .char-correct {
            color: #16a34a; /* Green */
            background-color: #dcfce7;
            border-radius: 2px;
        }
        
        .char-incorrect {
            color: #dc2626; /* Red */
            background-color: #fee2e2;
            text-decoration: underline;
        }

        .char-current {
            border-bottom: 3px solid #3b82f6;
            background-color: #e0f2fe;
        }

        /* Input styling */
        .line-input {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #e2e8f0;
            width: 100%;
            padding: 8px 0;
            outline: none;
            transition: all 0.2s;
            color: #1e293b;
        }
        .line-input:focus {
            border-bottom-color: #3b82f6;
            background-color: #f0f9ff;
        }
        .line-input:disabled {
            background-color: #f8fafc;
            border-bottom-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Zhuyin (Ruby) Styling */
        ruby {
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            vertical-align: bottom;
            margin-right: 0.05em;
        }
        rt {
            display: block;
            font-size: 0.55em; 
            line-height: 1.2;
            text-align: center;
            color: #64748b;
            font-weight: normal;
            font-family: system-ui, -apple-system, sans-serif; /* Fallback for clear zhuyin */
            letter-spacing: 0;
        }
        
        /* Hide zhuyin when option is unchecked via CSS class on container */
        .no-zhuyin rt {
            display: none;
        }
        .no-zhuyin ruby {
            display: inline;
            margin-right: 0;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header & Controls -->
    <header class="bg-white shadow-md p-4 z-20 relative flex-none">
        <div class="max-w-6xl mx-auto flex flex-col xl:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2 whitespace-nowrap">
                <span class="text-3xl">⌨️</span> 
                <span class="hidden md:inline">國小國語</span>打字練習
            </h1>
            
            <div class="flex flex-col md:flex-row items-center gap-3 w-full xl:w-auto">
                <!-- Source Selection -->
                <div class="relative w-full md:w-72 group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                        📖
                    </div>
                    <select id="textSource" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5 transition-colors cursor-pointer hover:bg-white">
                        <optgroup label="第一課">
                            <option value="L01">01. 心的悄悄話</option>
                        </optgroup>
                        <optgroup label="第二課：妙故事點點名">
                            <option value="L02_1">02-1. 歪打正著</option>
                            <option value="L02_2">02-2. 忙中有錯</option>
                        </optgroup>
                        <optgroup label="第三課">
                            <option value="L03">03. 繞口令村</option>
                        </optgroup>
                        <optgroup label="第四課">
                            <option value="L04">04. 小丑魚和海葵</option>
                        </optgroup>
                        <optgroup label="第五課">
                            <option value="L05">05. 飛舞的絲帶</option>
                        </optgroup>
                        <optgroup label="第六課">
                            <option value="L06">06. 小女生</option>
                        </optgroup>
                        <optgroup label="第七課">
                            <option value="L07">07. 淡水小鎮 (詩歌)</option>
                        </optgroup>
                        <optgroup label="第八課">
                            <option value="L08">08. 安平古堡參觀記</option>
                        </optgroup>
                        <optgroup label="第九課">
                            <option value="L09">09. 馬太鞍的巴拉告</option>
                        </optgroup>
                        <optgroup label="第十課">
                            <option value="L10">10. 狐狸的故事 (寓言詩)</option>
                        </optgroup>
                        <optgroup label="第十一課">
                            <option value="L11">11. 巨人的花園</option>
                        </optgroup>
                        <optgroup label="第十二課">
                            <option value="L12">12. 奇特的朋友</option>
                        </optgroup>
                        <optgroup label="自訂功能">
                            <option value="custom" class="font-bold text-blue-600">📂 上傳文字檔 (.txt)...</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Zhuyin Toggle -->
                <label class="flex items-center gap-2 cursor-pointer bg-orange-50 px-3 py-2 rounded-lg border border-orange-200 hover:bg-orange-100 transition-colors">
                    <input type="checkbox" id="zhuyinToggle" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                    <span class="text-sm font-medium text-gray-700 select-none">顯示注音</span>
                </label>
                
                <input type="file" id="fileInput" accept=".txt" class="hidden"/>

                <!-- Time Setting -->
                <div class="flex items-center bg-gray-50 rounded-lg border border-gray-300 px-2 py-1">
                    <span class="text-sm text-gray-600 mr-2">時間:</span>
                    <input type="number" id="timeSetting" value="10" min="1" max="60" class="w-12 bg-transparent border-0 p-0 text-center text-gray-800 font-bold focus:ring-0">
                    <span class="text-sm text-gray-500 ml-1">分</span>
                </div>

                <!-- Timer Display -->
                <div id="timerDisplay" class="text-2xl font-mono font-bold text-blue-600 w-24 text-center bg-blue-50 rounded px-2 py-1">
                    10:00
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2 w-full md:w-auto justify-end">
                <button id="startBtn" class="flex-1 md:flex-none text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    開始
                </button>
                <button id="stopBtn" disabled class="flex-1 md:flex-none text-white bg-red-500 hover:bg-red-600 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    結束
                </button>
                <button id="resetBtn" class="flex-1 md:flex-none text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:ring-4 focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
                    重置
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-4 flex flex-col gap-4 overflow-hidden">
        
        <!-- Live Stats Bar -->
        <div class="flex-none flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-sm text-gray-600 gap-2">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-gray-400" id="statusDot"></span>
                狀態: <span id="statusText" class="font-semibold text-gray-700">準備就緒</span>
            </div>
            <div class="flex gap-6">
                <span class="flex items-center gap-1">
                    🎯 完成率: <span id="progressText" class="font-bold text-gray-800 text-lg">0%</span>
                </span>
                <span class="hidden md:flex items-center gap-1">
                    ⚡ 速度估算: <span id="liveWPM" class="font-bold text-gray-400">--</span> CPM
                </span>
                <span class="flex items-center gap-1 text-gray-400 text-xs">
                    (按 Enter 跳下一行)
                </span>
            </div>
        </div>

        <!-- Typing Container (Interleaved Lines) -->
        <div id="linesContainer" class="flex-1 bg-white rounded-2xl shadow-lg border border-gray-200 overflow-y-auto custom-scrollbar p-6 space-y-6 relative no-zhuyin">
            <!-- Dynamic Content generated by JS -->
            <div class="text-center text-gray-400 mt-10">
                載入中...
            </div>
        </div>
    </main>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-gray-900/60 hidden items-center justify-center z-50 backdrop-blur-md transition-all duration-300 opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-lg w-full mx-4 transform transition-all scale-95" id="modalContent">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                    🏆
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">練習完成!</h2>
                <p class="text-gray-500">休息一下，來看看你的成績吧</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-green-50 p-5 rounded-2xl text-center border border-green-100 transform hover:scale-105 transition-transform">
                    <div class="text-3xl font-bold text-green-600" id="resCorrect">0</div>
                    <div class="text-xs text-green-800 font-bold tracking-wide uppercase mt-1">正確字數</div>
                </div>
                <div class="bg-red-50 p-5 rounded-2xl text-center border border-red-100 transform hover:scale-105 transition-transform">
                    <div class="text-3xl font-bold text-red-600" id="resIncorrect">0</div>
                    <div class="text-xs text-red-800 font-bold tracking-wide uppercase mt-1">錯誤字數</div>
                </div>
                <div class="bg-blue-50 p-5 rounded-2xl text-center border border-blue-100 transform hover:scale-105 transition-transform">
                    <div class="text-3xl font-bold text-blue-600" id="resAccuracy">0%</div>
                    <div class="text-xs text-blue-800 font-bold tracking-wide uppercase mt-1">正確率</div>
                </div>
                <div class="bg-purple-50 p-5 rounded-2xl text-center border border-purple-100 transform hover:scale-105 transition-transform">
                    <div class="text-3xl font-bold text-purple-600" id="resCPM">0</div>
                    <div class="text-xs text-purple-800 font-bold tracking-wide uppercase mt-1">速度 (字/分)</div>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg hover:shadow-xl transform active:scale-95 flex items-center justify-center gap-2">
                <span>🔄</span> 再挑戰一次
            </button>
        </div>
    </div>

            L03: {
                text: `我叫小金，是個旅行家。\n兩個多月前，由於突如其來的暴風雨，因此我的船在海上迷失了方向。\n風雨過後，船停在一座小島，這是一個我從來沒有到過的地方。\n一上岸，一個小孩跑過來撞到了我，我趕緊扶著他問：\n「你還好嗎？你要去哪裡？\n小孩說話又急又快：小綠送紅花，小力送黃花，\n小綠想拿紅花換小力的黃花，小力想把黃花換小綠的紅花。\n他們正在送花，我也要去拿一朵花。」\n我還沒聽明白，小孩又跑走了。\n走著走著，我看到一家店，牆上有隻「大公雞」，\n老闆熱情的說：抱著灰雞上飛機，飛機起飛，灰雞要飛。\n我們用料實在，除了最好吃的『灰雞』，飯後還有水果。\n是什麼水果呢？老闆笑咪咪的說：今天有兩種，\n你喜歡『吃葡萄不吐葡萄皮，不吃葡萄倒吐葡萄皮』的葡萄，\n還是『風吹桃枝落桃子，桃枝落桃撞猴子』的桃子呢？\n這兩種都是我們繞口令村有名的水果。\n原來，那個地方就叫繞口令村。\n我在那裡停留十多天，也學會了好幾個有趣的繞口令，直到現在，我還常常想起那裡呢！`,

            L04: {
                text: `在神祕的大海中，有一大片漂亮的海葵，有的像紅寶石，有的像綠寶石，有的像一朵花，有的像一棵樹，形成一個巨大的花園城堡。小丑魚開心自在的和朋友一起在這裡遊玩。\n這一天，有條黃色的大魚在遠遠的地方就看見小丑魚，心中有了一個想法。他慢慢的靠近，好聲好氣的說：早安！這裡真熱鬧，你們在做什麼？好像很有趣，我可以參加嗎？小丑魚笑著說：「你好！我們在玩躲貓貓，你也一起來玩吧！」大魚輕輕擺動尾巴游了過去。沒想到他一靠近，就露出不懷好意的笑容，張開大大的嘴巴，吸了一口氣。小丑魚意識到他居心不良，趕快找地方躲起來。海葵眼看小丑魚驚慌的左右閃躲，大叫一聲：快！躲到我這裡！海葵等到大魚靠近時，抓準時機射出刺針。好痛！大魚哇哇叫，只好使出全力游出花園城堡。\n海葵望著遠去的大魚說：我的觸手雖然美麗，卻是有毒的。小丑魚是我的好朋友，誰都不能欺負他。小丑魚感動的說：「謝謝你！每當我遇到危險，都是你出面幫忙。`,

            L05: {
                text: `十月太陽高高掛，我們在朝會時間練習大會操，大家都很努力，跳得滿身汗。終於，總指導的黃老師在臺上說：小朋友大部分都跳得很好，只有中間一小段，常常左、右跳錯邊。各班回去利用時間多練習，運動會那天，才能拿出最好的表現。我聽了，知道是自己沒跳好，心裡有些發愁。中間那段動作太快，我經常左右不分，害得後面整排同學都跳錯。運動會就快到了，這下該怎麼辦？\n回到教室，走到座位前，我的桌上竟然有張紙條，寫著：李文貴：第二節下課後，到司令臺來。請不要忘記！班長留 十月十二日。班長有事找我，直接說就好，為什麼這麼神祕？下課後，我懷著不安的心情走到司令臺，發現我們那排同學都來了，原來他們也都收到紙條。班長手裡有好多條絲帶，她說：請把絲帶綁在右手，只要記得有絲帶是右手，沒絲帶是左手，這樣是不是就簡單多了？\n原來是要練大會操，我鬆了一口氣，旁邊的同學也說，他們會幫忙喊「絲帶」、「沒絲帶」，多練幾次，必定沒問題。練習幾次後，我們果然都跳對了。我有些不好意思的說：「只有我們這一排的人綁絲帶，從臺上看一定很奇怪！\n不奇怪！班上同學通通跑來了，他們的手上也都被著絲帶，笑著說：李文貴，你看我們這樣好不好看？全班同學又在操場練了一次大會操。藍天下，我們的絲帶飛舞，有大家的陪伴，真好！`,

            L06: {
                text: `小女生來我家好幾年了，牠非常喜歡我。我上洗手間，牠會喵喵叫；我關門洗澡，牠就叫得更大聲。只要我在家，牠都會緊緊的跟在我身邊。\n每當我做完事情，對著空中大叫「小女生」，哪怕正在角落睡得香甜，牠也會奮力睜開眼睛，慢慢走到我身旁。心情好的時候，牠會邊走邊回應，一聲一聲，牠喵一下，一唱一和，高高低低，輕重不同；心情不好的時候，牠會安安靜靜的走來，用雪亮的大眼睛，不高興的看著我，像是在說：「到底什麼事啊？」\n平時，牠喜歡四腳朝天的躺在沙發上，毛茸茸的肚子，看起來像蓋上了一條白色小被子。這時候，我會過去摸摸牠柔細的毛，揉揉牠又圓又胖的肚子。牠半睜著眼睛，輕搖著尾巴，一副很享受的樣子。牠更喜歡把前腳放在我的大腿上，輕輕的喵個不停，像個可愛的小孩，陪伴我和家人說話。我們講，牠也講，一家人七嘴八舌講整晚的話，十分熱鬧。\n小女生也是我們家重要的「膠水」，牠把一家人緊緊的黏在一起。關於「小女生」的故事，三天三夜也說不完，因為，牠是一隻全世界最可愛的貓。`,

                text: `長長的老街，\n有傳統餅店，\n有百年商行。\n淡水的現在，\n淡水的過往，\n都在這條古老的街上。\n阿婆的鐵蛋，\n又硬又圓，\n又黑又亮。\n像那古早的故事一樣，\n愈嚼愈香。\n蒼老的紅毛城，\n站在山坡上。\n靜靜的看著河口，\n靜靜的望著海洋，\n像在回憶以前的時光。\n紅紅的夕陽，\n照在淡水河上。\n小船哪！\n你輕輕的搖盪，\n是在網魚，\n還是在網那金黃色的波浪？`,

            L08: {
                text: `今天是學校的戶外教育日，我們參觀的地點是位於臺南的安平古堡。坐了好久的車，終於來到我們期待已久的地方。我們先參觀博物館，裡面放著許多文物：有過往的史料，有古城的模型，還有地圖和照片。看了這些我才知道，這裡的古城牆最早是荷蘭人蓋的。後來，鄭成功打敗荷蘭人，駐守在這裡，安平這個軍事要地就更有名了。\n從博物館出來後，我們來到了古炮平臺，那裡有一排古炮，炮口對著遠方，像在想念以前風光的日子，又像在守護著安平古堡。它們是勇敢的士兵，經過這麼長的日子，始終堅守著這片土地。我們往上走，附近還有一座瞭望臺，紅紅的屋頂，白色的牆，又高又大，是安平古堡的地標。走上去，站在最高處往四面遠望，可以看到美麗的風光。\n接近中午的時候，我們走到旁邊的公園，裡頭有一面老城牆，上面長滿樹根。雖然經過三百多年，老城牆還是很堅固。它安靜的站在公園裡，好像在說著過往的故事。這次的參觀，我看到寶貴的文物，也認識了安平古堡的故事，收穫真的好多！`,

            L11: {
                text: `有一個巨人，他蓋了一座大花園。春天的時候，他看著花園裡開滿美麗的花朵，聽著樹上的鳥兒唱著美妙的歌曲，心情就特別愉悅。\n有一天，巨人出遠門去拜訪朋友，過了很久還沒回來，附近的孩子就到花園裡遊玩。巨人回到家，發現孩子們在花園裡玩得很開心，他生氣的大叫：「花園是我的！你們怎麼可以跑進來呢？」於是，他築起了一道高高的牆，把花園圍起來，免得孩子們跑進來。孩子們望著高高的圍牆，心裡想：「美麗的花園為什麼被圍起來了呢？」他們進不去，只好失望的離開。\n秋天過了，冬天來了，園裡的花謝了，小鳥也飛走了。花園裡自從少了孩子的笑聲，冬天顯得特別漫長，直到第二年春天，花園裡還是冷冷清清。巨人天天盼著花園裡乾枯的樹枝，能趕快長出新芽，美麗的花兒也能快快綻放。\n有一天，巨人發現圍牆上有個小洞，孩子們正一個個從洞口鑽進花園。他們走過的地方，草綠了！跑過的地方，花開了！跳過的地方，小鳥飛來了！花園又熱鬧了起來。巨人這才恍然大悟的說：「沒有孩子們的笑聲，花園裡還有什麼快樂呢？」於是，他把圍牆拆除，讓孩子們可以自由自在的進來遊玩。孩子們來到巨人的身邊，圍著他唱著、跳著，開心極了！這時百花盛開，鳥語花香，春天隨著孩子們的笑聲，又回到花園裡來了。`,

            L12: {
                text: `那一天，因為飛機故障，我一個人在沙漠過了一夜。第二天早上，有個細細的聲音叫醒我：「請你……幫我畫一隻綿羊！」我跳了起來，不敢相信的揉著眼睛，這裡是沙漠正中央，遠離人煙快要兩千公里，這個小男孩怎麼出現的？\n看我不說話，他溫柔而客氣的重複說著：「請你畫一隻綿羊給我好嗎？」他是誰？他從哪兒來？他為什麼要一隻綿羊？那時的我，竟然沒說出心中的疑問，就拿出紙和筆，打算幫他的忙。我不太會畫畫，上一次畫畫是在六歲的時候，我畫了一張畫，畫完後直冒冷汗，心裡害怕極了！可是每個大人都很不以為然的說：「不過是一頂帽子，怎麼會可怕呢？」那時，我剛讀完一本關於原始森林的書，我畫的真的不是帽子。\n小男孩用期待的眼神看著我：「你可以開始畫了嗎？」該怎麼畫一隻綿羊呢？我心裡半點想法都沒有，只好在紙上畫了六歲時的那幅畫。小男孩一看就後退一大步：「不！不！這太可怕了，我不要一條吞下大象的蟒蛇！」這時，換我驚訝得說不出話來，他怎麼知道我畫的就是一條正在消化大象的蟒蛇？\n這就是我和「小王子」認識的經過，在他離開前，我聽他說了很多的故事。一直到現在，他還是我心中那位最奇特的朋友。`,

        // State Variables

        // --- Core Helper: Generate HTML with Ruby ---
        // 將純文字與注音代碼合併為 HTML
        function generateRubyHtml(text, zhuyinCodeString) {
            if (!zhuyinCodeString) {
                // 如果沒有注音資料，回傳純文字的 span 結構
                return text.split('').map(char => `<span>${char}</span>`).join('');
            }

            const zhuyinList = zhuyinCodeString.trim().split(' ');
            let html = '';
            let zIndex = 0;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                // 判斷是否為中文字 (簡單判斷範圍，包含常見漢字)
                // 標點符號不加注音
                if (/[\u4e00-\u9fa5]/.test(char)) {
                    if (zIndex < zhuyinList.length) {
                        const code = zhuyinList[zIndex];
                        // 使用 ruby 標籤包覆
                        html += `<ruby><span>${char}</span><rt>${code}</rt></ruby>`;
                        zIndex++;
                    } else {
                        // 防呆：注音不夠時顯示原字
                        html += `<span>${char}</span>`;
                    }
                } else {
                    // 標點符號或非中文字
                    html += `<span>${char}</span>`;
                }
            }
            return html;
        }

        // --- Helper: Split Text ---
        // 根據標點符號分句，回傳 { text: string, zhuyin: string } 的陣列
        function splitTextData(textData) {
            const rawText = textData.text;
            const rawZhuyin = textData.zhuyin_codes || "";
            
            // 1. 分割純文字
            const regex = /[^。！？：；\n]+[。！？：；\n]*|.+/g;
            const textSegments = rawText.match(regex).map(s => s.trim()).filter(s => s.length > 0);
            
            if (!rawZhuyin) {
                return textSegments.map(seg => ({ text: seg, zhuyin: "" }));
            }

            // 2. 分割注音代碼 (這比較複雜，因為注音是空格分隔的字串)
            // 我們需要根據 textSegments 中每個片段含有的「中文字數量」，來從 rawZhuyin 中切出對應的代碼
            const zhuyinList = rawZhuyin.trim().split(' ');
            let currentZhuyinIndex = 0;
            
            return textSegments.map(seg => {
                // 計算該片段有幾個中文字
                let chineseCharCount = 0;
                for (let char of seg) {
                    if (/[\u4e00-\u9fa5]/.test(char)) {
                        chineseCharCount++;
                    }
                }
                
                // 取出對應數量的注音
                const segmentZhuyinList = zhuyinList.slice(currentZhuyinIndex, currentZhuyinIndex + chineseCharCount);
                currentZhuyinIndex += chineseCharCount;
                
                return {
                    text: seg,
                    zhuyin: segmentZhuyinList.join(' ')
                };
            });
        }

        function prepareGameLines(textData) {
            const segmentsData = splitTextData(textData);
            segments = segmentsData.map(s => s.text); // 保存純文字供比對用

            linesContainer.innerHTML = '';

            segmentsData.forEach((segData, index) => {
                // Wrapper
                const row = document.createElement('div');
                row.className = "flex flex-col gap-1 pb-4 border-b border-gray-100 last:border-0";
                
                // Reference Text Area
                const refDiv = document.createElement('div');
                refDiv.className = "typing-font text-gray-500 text-xl leading-relaxed select-none break-all flex flex-wrap items-end pl-1";
                refDiv.id = `ref-${index}`;
                
                // 生成 HTML (包含 ruby 標籤)
                // 這裡不管有沒有開注音，都生成 ruby 結構，透過 CSS 來隱藏/顯示 <rt>
                // 這樣切換時不需要重新生成 DOM，也不會影響輸入框狀態
                refDiv.innerHTML = generateRubyHtml(segData.text, segData.zhuyin);
                
                // Input Field
                const input = document.createElement('input');
                input.type = "text";
                input.className = "line-input typing-font text-xl";
                input.id = `input-${index}`;
                input.disabled = true;
                input.autocomplete = "off";
                input.spellcheck = false;
                input.placeholder = "點擊「開始」後在此輸入...";
                
                // Event Listeners
                input.addEventListener('input', (e) => handleLineInput(index, e));
                input.addEventListener('keydown', (e) => handleLineKeydown(index, e));
                input.addEventListener('focus', () => highlightActiveLine(index));

                row.appendChild(refDiv);
                row.appendChild(input);
                linesContainer.appendChild(row);
            });
            
            updateZhuyinVisibility();
        }

        function updateZhuyinVisibility() {
            if (zhuyinToggle.checked) {
                linesContainer.classList.remove('no-zhuyin');
            } else {
                linesContainer.classList.add('no-zhuyin');
            }
        }

        // --- Interaction Logic ---

        function handleLineInput(index, e) {
            if (!isRacing) return;
            
            const inputVal = e.target.value;
            const refText = segments[index]; // 始終比對純文字
            const refDiv = document.getElementById(`ref-${index}`);
            
            // 變色邏輯：需要同時處理有 ruby 和沒 ruby 的情況 (文字在 span 內)
            // 我們的 generateRubyHtml 結構是：
            // 中文: <ruby><span>字</span><rt>...</rt></ruby>
            // 符號: <span>，</span>
            // 所以我們要找所有的 span (它們包著字)
            
            const charSpans = refDiv.querySelectorAll('span'); // 這會選到所有字元 (包含在 ruby 內的)

            charSpans.forEach((span, i) => {
                // 重置樣式
                span.className = '';
                // 移除可能的父層 ruby 的額外樣式 (如果有)
                
                if (i < inputVal.length) {
                    if (inputVal[i] === refText[i]) {
                        span.classList.add('char-correct');
                    } else {
                        span.classList.add('char-incorrect');
                    }
                } else if (i === inputVal.length) {
                    span.classList.add('char-current');
                }
            });

            calculateProgress();
        }

        function handleLineKeydown(index, e) {
            if (!isRacing) return;

            if (e.key === 'Enter') {
                e.preventDefault();
                const nextInput = document.getElementById(`input-${index + 1}`);
                if (nextInput) {
                    nextInput.focus();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prevInput = document.getElementById(`input-${index - 1}`);
                if (prevInput) prevInput.focus();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const nextInput = document.getElementById(`input-${index + 1}`);
                if (nextInput) nextInput.focus();
            }
        }

        function highlightActiveLine(index) {
            const row = document.getElementById(`input-${index}`).parentElement;
            
            Array.from(linesContainer.children).forEach(child => {
                child.classList.remove('bg-blue-50/50');
            });
            
            row.classList.add('bg-blue-50/50');
            
            const containerRect = linesContainer.getBoundingClientRect();
            const rowRect = row.getBoundingClientRect();
            
            if (rowRect.bottom > containerRect.bottom || rowRect.top < containerRect.top) {
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function calculateProgress() {
            let totalTyped = 0;
            let totalLength = 0;
            let currentCorrect = 0;
            
            segments.forEach((seg, i) => {
                const val = document.getElementById(`input-${i}`).value;
                totalLength += seg.length;
                totalTyped += val.length;
                
                for(let k=0; k<val.length && k<seg.length; k++) {
                    if (val[k] === seg[k]) currentCorrect++;
                }
            });

            const percentage = Math.min(100, Math.round((totalTyped / totalLength) * 100));
            progressText.textContent = `${percentage}%`;

            const elapsedMin = (Date.now() - startTime) / 60000;
            if (elapsedMin > 0 && totalTyped > 5) {
                const cpm = Math.round(currentCorrect / elapsedMin);
                liveWPM.textContent = cpm;
            }

            if (totalTyped >= totalLength) {
                const lastInput = document.getElementById(`input-${segments.length - 1}`);
                if (lastInput.value.length >= segments[segments.length - 1].length) {
                    endGame();
                }
            }
        }

        // --- Core Game Control ---

        function startGame() {
            let mins = parseInt(timeSettingInput.value);
            totalTimeSet = mins * 60;
            timeRemaining = totalTimeSet;

            isRacing = true;
            startTime = Date.now();
            
            const inputs = document.querySelectorAll('.line-input');
            inputs.forEach(inp => {
                inp.disabled = false;
                inp.value = '';
                inp.placeholder = '';
            });
            
            if(inputs.length > 0) inputs[0].focus();

            startBtn.disabled = true;
            stopBtn.disabled = false;
            textSourceSelect.disabled = true;
            timeSettingInput.disabled = true;
            // 遊戲中不禁止切換注音，因為我們是用 CSS 控制的，切換不會影響邏輯
            
            statusText.textContent = "比賽進行中...";
            statusText.className = "font-bold text-blue-600 animate-pulse";
            statusDot.className = "w-2 h-2 rounded-full bg-blue-500 animate-ping";

            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isRacing = false;
            clearInterval(timerInterval);
            
            const inputs = document.querySelectorAll('.line-input');
            inputs.forEach(inp => inp.disabled = true);

            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.textContent = "比賽結束";
            statusText.className = "font-bold text-red-600";
            statusDot.className = "w-2 h-2 rounded-full bg-red-500";
            textSourceSelect.disabled = false;
            
            calculateAndShowResults();
        }

        function calculateAndShowResults() {
            let correctCount = 0;
            let incorrectCount = 0;
            let totalTypedLength = 0;

            segments.forEach((seg, i) => {
                const val = document.getElementById(`input-${i}`).value;
                totalTypedLength += val.length;

                for (let k = 0; k < val.length; k++) {
                    if (k < seg.length) {
                        if (val[k] === seg[k]) {
                            correctCount++;
                        } else {
                            incorrectCount++;
                        }
                    } else {
                        incorrectCount++; 
                    }
                }
            });

            const accuracy = (totalTypedLength > 0) 
                ? Math.round((correctCount / totalTypedLength) * 100) 
                : 0;

            const timeElapsedSeconds = totalTimeSet - timeRemaining;
            const effectiveTimeMins = Math.max(timeElapsedSeconds, 1) / 60;
            const cpm = Math.round(correctCount / effectiveTimeMins);

            resCorrect.textContent = correctCount;
            resIncorrect.textContent = incorrectCount;
            resAccuracy.textContent = `${accuracy}%`;
            resCPM.textContent = cpm;

            resultModal.classList.remove('hidden');
            resultModal.classList.add('flex');
            setTimeout(() => {
                resultModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function resetGame() {
            isRacing = false;
            clearInterval(timerInterval);
            
            let mins = parseInt(timeSettingInput.value);
            totalTimeSet = mins * 60;
            timeRemaining = totalTimeSet;
            updateTimerDisplay();

            prepareGameLines(currentTextData);

            startBtn.disabled = false;
            stopBtn.disabled = true;
            textSourceSelect.disabled = false;
            timeSettingInput.disabled = false;
            
            statusText.textContent = "準備就緒";
            statusText.className = "font-semibold text-gray-700";
            statusDot.className = "w-2 h-2 rounded-full bg-gray-400";
            progressText.textContent = "0%";
            liveWPM.textContent = "--";
        }

        // --- Event Listeners ---
        
        textSourceSelect.addEventListener('change', (e) => {
            if (isRacing) resetGame();
            const val = e.target.value;
            if (val === 'custom') {
                fileInput.click();
            } else {
                currentTextData = TEXTS[val];
                fileInput.value = ''; 
                prepareGameLines(currentTextData);
            }
        });

        // Toggle Zhuyin (CSS only switch now)
        zhuyinToggle.addEventListener('change', (e) => {
            updateZhuyinVisibility();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                textSourceSelect.value = 'L01';
                currentTextData = TEXTS.L01;
                prepareGameLines(currentTextData);
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                const cleanContent = content.trim(); 
                if(cleanContent.length === 0) {
                    alert("檔案內容為空！");
                    return;
                }
                currentTextData = { text: cleanContent, zhuyin_codes: "" }; // No zhuyin for custom files
                prepareGameLines(currentTextData);
            };
            reader.readAsText(file);
        });

        timeSettingInput.addEventListener('change', (e) => {
            if (isRacing) return;
            let mins = parseInt(e.target.value);
            if (mins < 1) mins = 1;
            if (mins > 120) mins = 120;
            totalTimeSet = mins * 60;
            timeRemaining = totalTimeSet;
            updateTimerDisplay();
        });

        startBtn.addEventListener('click', () => {
            if (isRacing) return;
            startGame();
        });

        stopBtn.addEventListener('click', () => {
            if (!isRacing) return;
            endGame();
        });

        resetBtn.addEventListener('click', () => {
            resetGame();
        });

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining < 60) {
                timerDisplay.classList.add('text-red-600', 'bg-red-50');
                timerDisplay.classList.remove('text-blue-600', 'bg-blue-50');
            } else {
                timerDisplay.classList.remove('text-red-600', 'bg-red-50');
                timerDisplay.classList.add('text-blue-600', 'bg-blue-50');
            }
        }

        function closeModal() {
            resultModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                resultModal.classList.add('hidden');
                resultModal.classList.remove('flex');
                resetGame();
            }, 300);
        }

        init();

    </script>
</body>
</html>
